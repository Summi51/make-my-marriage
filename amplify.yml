version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Names only. Amplify supplies the values; this file must never contain them.
        - env | grep -e '^APP_ORIGIN=' -e '^MONGODB_URI=' -e '^MEMBER_INVITATION_SECRET=' -e '^VOLANEA_API_KEY=' -e '^VOLANEA_FROM=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
