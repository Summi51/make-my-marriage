version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Names only. Amplify supplies the values; this file must never contain them.
        # A new build is required after changing environment variables.
        - node scripts/write-production-env.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
